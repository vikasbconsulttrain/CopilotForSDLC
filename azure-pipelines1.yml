trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  solution: CopilotForSDLC.slnx
  apiProject: src/LoanApplication.Api/LoanApplication.Api.csproj
  testProject: tests/LoanApplication.Api.Tests/LoanApplication.Api.Tests.csproj
  testResultsDirectory: $(Agent.TempDirectory)/TestResults
  publishDirectory: $(Build.ArtifactStagingDirectory)/publish
  packageDirectory: $(Build.ArtifactStagingDirectory)
  packageName: LoanApplication.Api.zip

steps:
- task: UseDotNet@2
  displayName: 'Use .NET SDK 10.x'
  inputs:
    packageType: sdk
    version: 10.0.x

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: restore
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: test
    projects: '$(testProject)'
    arguments: '--configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(testResultsDirectory)" --collect:"XPlat Code Coverage"'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(testResultsDirectory)/**/*.trx'
    searchFolder: '$(testResultsDirectory)'
    failTaskOnFailedTests: true
    testRunTitle: 'LoanApplication.Api.Tests'

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    codeCoverageTool: Cobertura
    summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(testResultsDirectory)'
    failIfCoverageEmpty: true

- task: DotNetCoreCLI@2
  displayName: 'Publish application'
  inputs:
    command: publish
    publishWebProjects: false
    projects: '$(apiProject)'
    arguments: '--configuration $(buildConfiguration) --no-restore --output $(publishDirectory)'
    zipAfterPublish: false

- task: ArchiveFiles@2
  displayName: 'Archive application package'
  inputs:
    rootFolderOrFile: '$(publishDirectory)'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(packageDirectory)/$(packageName)'
    replaceExistingArchive: true

- task: PublishPipelineArtifact@1
  displayName: 'Publish package artifact'
  inputs:
    targetPath: '$(packageDirectory)/$(packageName)'
    artifact: 'drop'
    publishLocation: pipeline
